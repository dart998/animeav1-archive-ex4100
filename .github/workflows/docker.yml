name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - docker-compose.yml
  workflow_dispatch:

concurrency:
  group: animeav1-archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_VERSION: 0.6.1
  IMAGE_NAME: ovelayos/animeav1-archive-ex4100

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ env.APP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update compose image tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("docker-compose.yml")
          text = path.read_text()
          image = re.escape(os.environ["IMAGE_NAME"])
          version = os.environ["APP_VERSION"]
          pattern = rf'(image:\s+\$\{{ARCHIVE_IMAGE:-{image}:)[^}}]+(\}})'
          updated, count = re.subn(pattern, rf'\g<1>{version}\2', text, count=1)
          if count != 1:
              raise SystemExit("Could not locate ARCHIVE_IMAGE in docker-compose.yml")
          path.write_text(updated)
          PY

          if git diff --quiet -- docker-compose.yml; then
            echo "docker-compose.yml already points to ${APP_VERSION}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docker-compose.yml
            git commit -m "Deploy ${APP_VERSION}"
            git push origin HEAD:main
          fi

      - name: Redeploy Portainer stack
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${PORTAINER_WEBHOOK_URL}"
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --retry-delay 5 \
            "${PORTAINER_WEBHOOK_URL}"
