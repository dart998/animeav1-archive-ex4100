name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - docker-compose.yml
  workflow_dispatch:

concurrency:
  group: animeav1-archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_VERSION: 0.6.14
  IMAGE_NAME: ovelayos/animeav1-archive-ex4100

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changelog entry
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "## [${APP_VERSION}]" CHANGELOG.md || {
            echo "CHANGELOG.md does not contain an entry for ${APP_VERSION}"
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ env.APP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify compose image tag
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "${IMAGE_NAME}:${APP_VERSION}" docker-compose.yml || {
            echo "docker-compose.yml does not point to ${APP_VERSION}"
            exit 1
          }
