name: Redeploy Portainer stack

on:
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - ".github/workflows/redeploy-compose.yml"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer webhook
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${PORTAINER_WEBHOOK_URL}"
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --retry-delay 5 \
            "${PORTAINER_WEBHOOK_URL}"
