name: Redeploy pinned image

on:
  push:
    branches:
      - main
    paths:
      - docker-compose.yml
      - .github/workflows/redeploy-pinned.yml
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify pinned 0.6.27 image
        run: grep -Fq "ovelayos/animeav1-archive-ex4100:0.6.27" docker-compose.yml
      - name: Redeploy Portainer stack
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${PORTAINER_WEBHOOK_URL}"
          curl --fail --silent --show-error --request POST --retry 3 --retry-delay 5 "${PORTAINER_WEBHOOK_URL}"
