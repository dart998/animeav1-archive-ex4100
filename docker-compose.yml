version: "2.4"

services:
  animeav1-archive:
    image: ${ARCHIVE_IMAGE:-ovelayos/animeav1-archive-ex4100:0.6.2}
    container_name: ${CONTAINER_NAME:-animeav1-archive}
    hostname: ${HOSTNAME:-animeav1-archive}
    restart: unless-stopped

    ports:
      - "${WEB_PORT:-8090}:8080"

    environment:
      TZ: ${TZ:-Europe/Madrid}
      ANIMEAV1_BASE_URL: ${ANIMEAV1_BASE_URL:-https://animeav1.com}
      ARCHIVE_DB: /data/db/archive.sqlite
      ARCHIVE_DATA_DIR: /data
      ARCHIVE_SITE_DIR: /data/site
      ARCHIVE_METADATA_DIR: /data/metadata
      ARCHIVE_IMAGES_DIR: /data/images
      ARCHIVE_VIDEO_DIR: /library
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-true}
      CRAWLER_INTERVAL: ${CRAWLER_INTERVAL:-30m}
      CRAWLER_BATCH_SIZE: ${CRAWLER_BATCH_SIZE:-5}
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-1}
      PREFERRED_PROVIDER: ${PREFERRED_PROVIDER:-hls}
      PROVIDER_ORDER: ${PROVIDER_ORDER:-hls,upnshare,mega,mp4upload}
      PROVIDER_FALLBACK: ${PROVIDER_FALLBACK:-true}
      DOWNLOAD_VIDEOS: ${DOWNLOAD_VIDEOS:-false}
      VIDEO_DOWNLOAD_AUTHORIZED: ${VIDEO_DOWNLOAD_AUTHORIZED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - /mnt/HD/HD_a2/Public/animeav1-archive:/data
      - /mnt/HD/HD_a2/Public/Anime/Series:/library
